name: publish

# Publishes to PyPI through Trusted Publishing (OIDC), so no API token is
# stored in the repository. PyPI must have a publisher configured for:
#   owner       thulasiramk-2310
#   repository  cli_metrics
#   workflow    publish.yml
#   environment release
#
# Cutting a release: bump the version in pyproject.toml and sysdash/__init__.py,
# then publish a GitHub Release. Or run this workflow by hand from the Actions
# tab to push whatever is currently on main.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import sysdash, sysdash.keys; print(sysdash.__version__)"
          /tmp/check/bin/sysdash --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name registered with the PyPI publisher.
    environment: release
    permissions:
      # Mints the short-lived OIDC token PyPI trades for upload rights.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
